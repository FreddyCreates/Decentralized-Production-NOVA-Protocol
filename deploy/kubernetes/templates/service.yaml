apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sovereign
  labels:
    app.kubernetes.io/name: nova-sovereign
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: replica
      protocol: TCP
      name: replica
    - port: 3000
      targetPort: dashboard
      protocol: TCP
      name: dashboard
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: 8443
      targetPort: sovereign-api
      protocol: TCP
      name: sovereign-api
    - port: {{ .Values.runtime.port }}
      targetPort: runtime
      protocol: TCP
      name: runtime
  selector:
    app.kubernetes.io/name: nova-sovereign
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sovereign
  labels:
    app.kubernetes.io/name: nova-sovereign
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- if .Values.sovereign.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-sovereign
  labels:
    app.kubernetes.io/name: nova-sovereign
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nova-sovereign
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: {{ .Values.runtime.port }}
    {{- if .Values.sovereign.networkPolicy.allowedCIDRs }}
    - from:
      {{- range .Values.sovereign.networkPolicy.allowedCIDRs }}
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
