worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;

    # Logging
    log_format sovereign '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'client_cert="$ssl_client_s_dn"';

    access_log /var/log/nginx/access.log sovereign;

    # SSL Configuration
    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # mTLS - Client certificate verification
    ssl_client_certificate /etc/nova/keys/ca.crt;
    ssl_verify_client optional;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

    # Upstream: NOVA Sovereign Node
    upstream nova_sovereign {
        server nova-sovereign:8080;
    }

    upstream nova_dashboard {
        server nova-sovereign:3000;
    }

    # HTTPS Server (Sovereign API)
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nova/keys/server.crt;
        ssl_certificate_key /etc/nova/keys/server.key;

        # Canister API
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            # Require client certificate for API access
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            proxy_pass http://nova_sovereign;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Verify $ssl_client_verify;
        }

        # Dashboard
        location / {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass http://nova_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
